name: Compilar NetheriteLock

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar plugin
        run: mvn -B clean package

      - name: Guardar plugin compilado
        uses: actions/upload-artifact@v4
        with:
          name: NetheriteLock-1.21.1
          path: target/*.jar
